<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMS-200 Arama</title>
<style>
 :root{--bg:#0f1115;--p:#181b22;--fg:#e6e6e6;--mut:#8a93a6;--acc:#4ea1ff;--br:#2a2f3a}
 *{box-sizing:border-box} body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
   background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
 header{padding:12px 16px;border-bottom:1px solid var(--br);background:var(--p);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 input[type=search],select{background:#0d0f13;color:var(--fg);border:1px solid var(--br);border-radius:8px;padding:9px 12px;font-size:15px}
 input[type=search]{flex:1;min-width:240px}
 button{background:var(--acc);border:0;color:#04121f;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer}
 main{flex:1;display:grid;grid-template-columns:minmax(340px,42%) 1fr;overflow:hidden}
 #list{overflow:auto;border-right:1px solid var(--br)}
 .card{padding:11px 14px;border-bottom:1px solid var(--br);cursor:pointer}
 .card:hover{background:#161a22} .card.sel{background:#12233a}
 .meta{color:var(--mut);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 .tag{background:#222833;border-radius:5px;padding:1px 6px;color:#b9c4d6}
 .snip{color:#cfd6e4;margin-top:4px;font-size:13.5px}
 #view{overflow:auto;padding:16px;display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
 #view img{max-width:100%;border:1px solid var(--br);border-radius:8px;background:#fff}
 pre{white-space:pre-wrap;word-break:break-word;background:#0d0f13;border:1px solid var(--br);
     border-radius:8px;padding:12px;font-size:13px}
 /* markdown render (kök .md dökümanları) — tablo/başlık/liste/kod */
 .md{background:#0d0f13;border:1px solid var(--br);border-radius:8px;padding:16px 20px;font-size:14px}
 .md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.1em 0 .5em}
 .md h1{font-size:1.5em;border-bottom:1px solid var(--br);padding-bottom:.3em}
 .md h2{font-size:1.25em;border-bottom:1px solid var(--br);padding-bottom:.25em}
 .md h3{font-size:1.1em}
 .md table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13px;display:block;overflow-x:auto}
 .md th,.md td{border:1px solid var(--br);padding:6px 10px;text-align:left;vertical-align:top}
 .md th{background:#1b2029;font-weight:600}
 .md tr:nth-child(even) td{background:#14181f}
 .md code{background:#1b2029;border-radius:4px;padding:1px 5px;font-size:.9em}
 .md pre{background:#0a0c10;margin:.6em 0}
 .md a{color:var(--acc)}
 .md hr{border:0;border-top:1px solid var(--br);margin:1.2em 0}
 .md ul,.md ol{padding-left:1.4em}
 .md blockquote{border-left:3px solid var(--acc);margin:.6em 0;padding:.1em 1em;color:#b9c4d6;background:#12151b}
 #stat{color:var(--mut);font-size:12.5px}
 .bos{color:var(--mut);padding:16px}
 .baslik{padding:10px 14px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--br)}
 .izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:10px}
 .kart{border:1px solid var(--br);border-radius:8px;overflow:hidden;cursor:pointer;background:#12151b}
 .kart:hover{border-color:var(--acc)} .kart.sel{border-color:var(--acc);box-shadow:0 0 0 2px #1d3a5c}
 .kart img{width:100%;display:block;background:#fff}
 .meta2{display:flex;gap:5px;padding:4px 6px;flex-wrap:wrap;font-size:11px}
 /* etiket çubuğu (view altı, sabit) */
 #labelbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--br);background:var(--p)}
 #labelbar input{flex:1;background:#0d0f13;color:var(--fg);border:1px solid var(--br);border-radius:8px;padding:9px 12px;font-size:14px}
 #labelbar button{background:#2a6f4e;color:#eafff4}
 #labelbar .durum{color:var(--mut);font-size:12px;white-space:nowrap}
 #reindex{background:#3a2f1a;color:#ffe6b3;border:1px solid #5a4a2a;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
 body{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
 </style></head><body>
 <header>
   <input id="q" type="search" placeholder="Ara…  (ör: GRAFCET, rodamiento, PLC programlama)" autofocus>
   <select id="lang">
    <option value="">Tüm diller</option><option>tr</option><option>en</option>
    <option>es</option><option>de</option><option>fr</option>
  </select>
  <select id="mode">
    <option value="hybrid">Hibrit</option><option value="lexical">Tam metin</option>
    <option value="semantic">Anlam</option>
  </select>
  <button id="go">Ara</button>
  <select id="docsel" title="Belgeye gözat (şemalar dahil)"><option value="">📄 Belge gözat…</option></select>
  <span id="stat"></span>
  <button id="reindex" title="Arşivi yeniden indeksle">⟳ İndeks</button>
 </header>
 <main>
   <div id="list"></div>
   <div id="view"><div class="bos">Sonuca tıkla → sayfa metni + görseli burada görünür.</div></div>
 </main>
 <div id="labelbar">
   <span class="durum" id="lblinfo">—</span>
   <input id="lbl" type="text" placeholder="Bu görsel/sayfa için etiket yaz (ör: 'FMS-203 hidrolik pres kısmı, terminal X3')…" disabled>
   <button id="lblsave" disabled>Etiketle</button>
 </div>
<script>
const $ = s => document.querySelector(s);
const esc = t => (t||"").replace(/[<>&]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));

// Belge listesini doldur (şema gözatma için)
async function belgeleriYukle(){
  try{
    const r = await fetch("/api/docs").then(x=>x.json());
    const seen = new Set(); let html = '<option value="">📄 Belge gözat…</option>';
    for(const d of r.docs){
      if(seen.has(d.doc)) continue; seen.add(d.doc);
      html += `<option value="${esc(d.doc)}">${esc(d.doc)}</option>`;
    }
    $("#docsel").innerHTML = html;
  }catch(e){}
}

// Bir dokümanın tüm sayfalarını ızgara olarak göster (metin + şema görselleri)
async function belgeAc(doc){
  const r = await fetch(`/api/doc_pages?doc=${encodeURIComponent(doc)}`).then(x=>x.json());
  const kartlar = r.pages.map(p=>`
    <div class="kart" data-doc="${esc(doc)}" data-page="${p.page ?? ''}">
      ${p.image_url?`<img src="${p.image_url}" loading="lazy" alt="sayfa ${p.page}">`:''}
      <div class="meta2"><span class="tag">${p.page!=null?('s.'+p.page):'belge'}</span>
        <span class="tag">${p.lang||'??'}</span>${p.tlen?'<span class="tag">metin</span>':''}</div>
    </div>`).join('');
  $("#list").innerHTML = `<div class="baslik">${esc(doc)} · ${r.pages.length} sayfa</div>` +
    `<div class="izgara">${kartlar}</div>`;
  document.querySelectorAll(".kart").forEach(c=>c.onclick=()=>{
    document.querySelectorAll(".kart").forEach(k=>k.classList.remove("sel"));
    c.classList.add("sel"); ac(c.dataset.doc, c.dataset.page);
  });
}

async function ara(){
  const q = $("#q").value.trim(), lang = $("#lang").value, mode = $("#mode").value;
  if(!q){ $("#list").innerHTML=""; $("#stat").textContent=""; return; }
  const t0 = performance.now();
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&lang=${lang}&mode=${mode}&limit=60`).then(x=>x.json());
  const ms = Math.round(performance.now()-t0);
  $("#stat").textContent = `${r.count} sonuç · ${ms} ms`;
  if(!r.count){ $("#list").innerHTML = '<div class="bos">Sonuç yok.</div>'; return; }
  $("#list").innerHTML = r.results.map((x,i)=>`
    <div class="card" data-doc="${esc(x.doc)}" data-page="${x.page ?? ''}">
      <div class="meta"><span class="tag">${esc(x.doc)}</span>
        <span>${x.page!=null?('s.'+x.page):(x.kind==='doc'?'belge':'')}</span>
        <span class="tag">${x.lang||'??'}</span>${x.has_image?'<span class="tag">🖼</span>':''}</div>
      <div class="snip">${esc((x.snippet||'').slice(0,220))||'<i style="color:#8a93a6">(eşleşme özeti yok)</i>'}</div>
    </div>`).join('');
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{
    document.querySelectorAll(".card").forEach(k=>k.classList.remove("sel"));
    c.classList.add("sel");
    ac(c.dataset.doc, c.dataset.page);
  });
}

async function ac(doc, page){
  const p = page ? `&page=${page}` : "";
  const r = await fetch(`/api/page?doc=${encodeURIComponent(doc)}${p}`).then(x=>x.json());
  const govde = r.html ? `<div class="md">${r.html}</div>` : `<pre>${esc(r.text||'')}</pre>`;
  $("#view").innerHTML = `
    <div class="meta"><span class="tag">${esc(r.doc)}</span>
      <span class="tag">${r.lang||'??'}</span>
      ${r.page!=null?'<span class="tag">s.'+r.page+'</span>':''}${r.label?'<span class="tag" style="background:#2a6f4e;color:#eafff4">🏷 '+esc(r.label)+'</span>':''}</div>
    ${r.image_url?`<img src="${r.image_url}" loading="lazy" alt="sayfa görseli">`:''}
    ${govde}`;
  // etiket çubuğunu bu sayfaya bağla
  seciliDoc = r.doc; seciliPage = r.page;
  $("#lbl").disabled = false; $("#lblsave").disabled = false;
  $("#lbl").value = r.label || "";
  $("#lblinfo").textContent = "🏷 " + r.doc + (r.page!=null?(" s."+r.page):"");
  $("#lbl").placeholder = r.image_url ? "Görsel etiketi (ör: 'X3 terminal şeması')…" : "Metin etiketi…";
}

// ---- etiket kaydet ----
let seciliDoc = null, seciliPage = null;
async function etiketKaydet(){
  const label = $("#lbl").value.trim();
  if(!seciliDoc || !label) return;
  $("#lblsave").disabled = true; $("#lblinfo").textContent = "kaydediliyor…";
  try{
    const r = await fetch("/api/label", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({doc: seciliDoc, page: seciliPage, label})}).then(x=>x.json());
    $("#lblinfo").textContent = r.ok ? ("✅ etiket kaydedildi — aramada bulunur") : "hata";
    // FTS anında güncellendi; aramayı tazele
  }catch(e){ $("#lblinfo").textContent = "hata: "+e; }
  $("#lblsave").disabled = false;
}
$("#lblsave").onclick = etiketKaydet;
$("#lbl").addEventListener("keydown", e=>{ if(e.key==="Enter") etiketKaydet(); });

// ---- indeks durumu / yeniden indeksle ----
async function durumYukle(){
  try{
    const s = await fetch("/api/status").then(x=>x.json());
    const tag = s.bayat ? `<span style="color:#ffce6a">⚠ bayat</span>` : `✔`;
    $("#stat").innerHTML = `${s.kayit} kayıt · embed:${s.embed}${s.model?(" ("+s.model+")"):""} ${tag}`;
  }catch(e){}
}
$("#reindex").onclick = async () => {
  $("#reindex").disabled = true; $("#stat").textContent = "⟳ indeksleniyor…";
  try{
    const r = await fetch("/api/reindex", {method:"POST"}).then(x=>x.json());
    $("#stat").textContent = r.ok ? `✅ ${r.kayit} kayıt` : "hata";
    belgeleriYukle();
  }catch(e){ $("#stat").textContent = "hata"; }
  $("#reindex").disabled = false;
};

$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") ara(); });
$("#go").onclick = ara; $("#lang").onchange = ara; $("#mode").onchange = ara;
$("#docsel").onchange = e => { if(e.target.value) belgeAc(e.target.value); };
belgeleriYukle();
// derin bağlantı: ?q=... &lang=... &mode=...
(() => {
  const u = new URLSearchParams(location.search);
  if (u.get("q")) $("#q").value = u.get("q");
  if (u.get("lang")) $("#lang").value = u.get("lang");
  if (u.get("mode")) $("#mode").value = u.get("mode");
})();
if ($("#q").value.trim()) ara();
durumYukle();
</script></body></html>
