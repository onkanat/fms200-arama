<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMS-200 Arama</title>
<style>
 :root{--bg:#0f1115;--p:#181b22;--fg:#e6e6e6;--mut:#8a93a6;--acc:#4ea1ff;--br:#2a2f3a}
 *{box-sizing:border-box} body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
   background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
 header{padding:12px 16px;border-bottom:1px solid var(--br);background:var(--p);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 input[type=search],select{background:#0d0f13;color:var(--fg);border:1px solid var(--br);border-radius:8px;padding:9px 12px;font-size:15px}
 input[type=search]{flex:1;min-width:180px}
 button{background:var(--acc);border:0;color:#04121f;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer}
 main{flex:1;display:grid;grid-template-columns:minmax(340px,42%) 1fr;overflow:hidden}
 #list{overflow:auto;border-right:1px solid var(--br)}
 .card{padding:11px 14px;border-bottom:1px solid var(--br);cursor:pointer}
 .card:hover{background:#161a22} .card.sel{background:#12233a}
 .meta{color:var(--mut);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 .tag{background:#222833;border-radius:5px;padding:1px 6px;color:#b9c4d6}
 .snip{color:#cfd6e4;margin-top:4px;font-size:13.5px}
 #view{overflow:auto;padding:16px;display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
 #view img{max-width:100%;border:1px solid var(--br);border-radius:8px;background:#fff}
 pre{white-space:pre-wrap;word-break:break-word;background:#0d0f13;border:1px solid var(--br);
     border-radius:8px;padding:12px;font-size:13px}
 /* markdown render (kök + durum/ .md dökümanları) */
 .md{background:#0d0f13;border:1px solid var(--br);border-radius:8px;padding:16px 20px;font-size:14px}
 .md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.1em 0 .5em}
 .md h1{font-size:1.5em;border-bottom:1px solid var(--br);padding-bottom:.3em}
 .md h2{font-size:1.25em;border-bottom:1px solid var(--br);padding-bottom:.25em}
 .md h3{font-size:1.1em}
 .md table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13px;display:block;overflow-x:auto}
 .md th,.md td{border:1px solid var(--br);padding:6px 10px;text-align:left;vertical-align:top}
 .md th{background:#1b2029;font-weight:600}
 .md tr:nth-child(even) td{background:#14181f}
 .md code{background:#1b2029;border-radius:4px;padding:1px 5px;font-size:.9em}
 .md pre{background:#0a0c10;margin:.6em 0}
 .md a{color:var(--acc)}
 .md hr{border:0;border-top:1px solid var(--br);margin:1.2em 0}
 .md ul,.md ol{padding-left:1.4em}
 .md blockquote{border-left:3px solid var(--acc);margin:.6em 0;padding:.1em 1em;color:#b9c4d6;background:#12151b}
 #stat{color:var(--mut);font-size:12.5px}
 .bos{color:var(--mut);padding:16px}
 .baslik{padding:10px 14px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--br)}
 .izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:10px}
 .kart{border:1px solid var(--br);border-radius:8px;overflow:hidden;cursor:pointer;background:#12151b}
 .kart:hover{border-color:var(--acc)} .kart.sel{border-color:var(--acc);box-shadow:0 0 0 2px #1d3a5c}
 .kart img{width:100%;display:block;background:#fff}
 .meta2{display:flex;gap:5px;padding:4px 6px;flex-wrap:wrap;font-size:11px}
 /* etiket çubuğu (view altı, sabit) */
 #labelbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--br);background:var(--p)}
 #labelbar input{flex:1;background:#0d0f13;color:var(--fg);border:1px solid var(--br);border-radius:8px;padding:9px 12px;font-size:14px}
 #labelbar button{background:#2a6f4e;color:#eafff4}
 #labelbar .durum{color:var(--mut);font-size:12px;white-space:nowrap}
 #reindex{background:#3a2f1a;color:#ffe6b3;border:1px solid #5a4a2a;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
 body{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
 /* kullanıcı */
 #user{background:#12233a;border:1px solid var(--br);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;color:#cfe2ff;white-space:nowrap}
 /* düzenle butonu + düzenleyici */
 #editbtn{background:#2a3f6f;color:#dbe8ff;border:1px solid #3d5a8f;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
 #editbtn:hover{background:#33508a}
 #modal{position:fixed;inset:0;background:#000a;display:none;z-index:50;padding:14px}
 #modal.acik{display:grid;grid-template-rows:auto 1fr auto;gap:10px}
 #modal .bas{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 #modal .bas b{font-size:15px}
 .edt{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
 .edt textarea{width:100%;height:100%;min-height:40vh;background:#0a0c10;color:var(--fg);border:1px solid var(--br);
   border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:none}
 .onizleme{overflow:auto;border:1px solid var(--br);border-radius:8px;padding:4px}
 .onizleme .md{border:0}
 .tb button{background:#222833;color:#dbe4f4;border:1px solid var(--br);padding:6px 10px;font-size:12.5px}
 #kaydet{background:#2a6f4e;color:#eafff4}
 #iptal{background:#3a2222;color:#ffd9d9}
 .gecmis{color:var(--mut);font-size:12.5px}
 /* 💬 Sor (RAG) paneli */
 #sorbtn{background:#2a6f4e;color:#eafff4}
 .ask{border:1px solid var(--br);border-radius:10px;background:#0d0f13;padding:14px 16px}
 .ask .sor{color:var(--mut);font-size:12.5px;margin-bottom:8px}
 .ask .yanit{font-size:14.5px;line-height:1.65;white-space:pre-wrap}
 .at{display:inline-block;background:#12233a;border:1px solid #26456b;color:#cfe2ff;border-radius:6px;
     padding:1px 7px;margin:2px 3px 0 0;font-size:12px;cursor:pointer}
 .at:hover{border-color:var(--acc)} .at.bilinmez{border-color:#6b4a26;color:#ffd9a8}
 .kaynaklar{display:grid;gap:6px;margin-top:10px}
 .kaynak{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#cfd6e4;
   border-top:1px solid var(--br);padding-top:6px;cursor:pointer}
 .kaynak:hover{color:#fff}
 .ask .hata{color:#ffce6a;font-size:13.5px}
 @media(max-width:820px){
   main{grid-template-columns:1fr} #list{max-height:34vh}
   .edt{grid-template-columns:1fr} .onizleme{display:none}
 }
</style></head><body>
<header>
  <input id="q" type="search" placeholder="Ara…  (ör: GRAFCET, rodamiento, PLC programlama)" autofocus>
  <select id="lang">
   <option value="">Tüm diller</option><option>tr</option><option>en</option>
   <option>es</option><option>de</option><option>fr</option>
 </select>
 <select id="mode">
   <option value="hybrid">Hibrit</option><option value="lexical">Tam metin</option>
   <option value="semantic">Anlam</option>
 </select>
 <button id="go">Ara</button>
 <button id="sorbtn" title="Arşive soru sor — yerel model, atıflı yanıt">💬 Sor</button>
 <select id="docsel" title="Belgeye gözat (şemalar dahil)"><option value="">📄 Belge gözat…</option></select>
 <span id="stat"></span>
 <button id="reindex" title="Arşivi yeniden indeksle">⟳ İndeks</button>
 <button id="user" title="Kullanıcı adını değiştir (düzenlemeler bu adla kaydedilir)">👤 misafir</button>
</header>
<main>
  <div id="list"></div>
  <div id="view"><div class="bos">Sonuca tıkla → sayfa metni + görseli burada görünür.</div></div>
</main>
<div id="labelbar">
  <span class="durum" id="lblinfo">—</span>
  <input id="lbl" type="text" placeholder="Bu görsel/sayfa için etiket yaz (ör: 'FMS-203 hidrolik pres kısmı, terminal X3')…" disabled>
  <button id="lblsave" disabled>Etiketle</button>
</div>

<!-- Markdown düzenleyici -->
<div id="modal">
  <div class="bas">
    <b id="edtbas">düzenle</b>
    <span class="gecmis" id="gecmis"></span>
    <span style="flex:1"></span>
    <span class="tb">
      <button data-ins="## ">H2</button>
      <button data-ins="**">kalın</button>
      <button data-ins="| a | b |\n|---|---|\n|  |  |">tablo</button>
      <button data-ins="- ">liste</button>
      <button id="onizlebtn">👁 önizleme</button>
    </span>
    <button id="kaydet">💾 Kaydet</button>
    <button id="iptal">İptal</button>
  </div>
  <div class="edt">
    <textarea id="edtmetin" spellcheck="false"></textarea>
    <div class="onizleme"><div class="md" id="onizleme"></div></div>
  </div>
  <div class="gecmis" id="kayitdurum"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => (t||"").replace(/[<>&]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));

// ---- kullanıcı kimliği (basit çok-kullanıcılık; düzenlemeler bu adla git'e işlenir) ----
function kullanici(){ return localStorage.getItem("fms_user") || ""; }
function kullaniciGoster(){ $("#user").textContent = "👤 " + (kullanici() || "misafir"); }
function kullaniciSor(){
  const y = prompt("Adınız (düzenlemeler bu adla kaydedilir — git kaydı):", kullanici() || "");
  if(y !== null){ localStorage.setItem("fms_user", y.trim()); kullaniciGoster(); }
}
$("#user").onclick = kullaniciSor;
kullaniciGoster();

// Belge listesini doldur (şema gözatma için)
async function belgeleriYukle(){
  try{
    const r = await fetch("/api/docs").then(x=>x.json());
    const seen = new Set(); let html = '<option value="">📄 Belge gözat…</option>';
    for(const d of r.docs){
      if(seen.has(d.doc)) continue; seen.add(d.doc);
      html += `<option value="${esc(d.doc)}">${esc(d.doc)}${d.md?" ✏️":""}</option>`;
    }
    $("#docsel").innerHTML = html;
  }catch(e){}
}

// Bir dokümanın tüm sayfalarını ızgara olarak göster (metin + şema görselleri)
async function belgeAc(doc){
  const r = await fetch(`/api/doc_pages?doc=${encodeURIComponent(doc)}`).then(x=>x.json());
  const kartlar = r.pages.map(p=>`
    <div class="kart" data-doc="${esc(doc)}" data-page="${p.page ?? ''}">
      ${p.image_url?`<img src="${p.image_url}" loading="lazy" alt="sayfa ${p.page}">`:''}
      <div class="meta2"><span class="tag">${p.page!=null?('s.'+p.page):'belge'}</span>
        <span class="tag">${p.lang||'??'}</span>${p.tlen?'<span class="tag">metin</span>':''}</div>
    </div>`).join('');
  $("#list").innerHTML = `<div class="baslik">${esc(doc)} · ${r.pages.length} sayfa${r.md?" · ✏️ düzenlenebilir":""}</div>` +
    `<div class="izgara">${kartlar}</div>`;
  document.querySelectorAll(".kart").forEach(c=>c.onclick=()=>{
    document.querySelectorAll(".kart").forEach(k=>k.classList.remove("sel"));
    c.classList.add("sel"); ac(c.dataset.doc, c.dataset.page);
  });
}

async function ara(){
  const q = $("#q").value.trim(), lang = $("#lang").value, mode = $("#mode").value;
  if(!q){ $("#list").innerHTML=""; $("#stat").textContent=""; return; }
  const t0 = performance.now();
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&lang=${lang}&mode=${mode}&limit=60`).then(x=>x.json());
  const ms = Math.round(performance.now()-t0);
  $("#stat").textContent = `${r.count} sonuç · ${ms} ms`;
  if(!r.count){ $("#list").innerHTML = '<div class="bos">Sonuç yok.</div>'; return; }
  $("#list").innerHTML = r.results.map((x,i)=>`
    <div class="card" data-doc="${esc(x.doc)}" data-page="${x.page ?? ''}">
      <div class="meta"><span class="tag">${esc(x.doc)}</span>
        <span>${x.page!=null?('s.'+x.page):(x.kind==='doc'?'belge':'')}</span>
        <span class="tag">${x.lang||'??'}</span>${x.has_image?'<span class="tag">🖼</span>':''}${x.label?'<span class="tag" style="background:#2a6f4e;color:#eafff4" title="'+esc(x.label)+'">🏷 '+esc(x.label.slice(0,46))+(x.label.length>46?'…':'')+'</span>':''}</div>
      <div class="snip">${esc((x.snippet||'').slice(0,220))||(x.label?'<i style="color:#8a93a6">🏷 '+esc(x.label)+'</i>':'<i style="color:#8a93a6">(eşleşme özeti yok)</i>')}</div>
    </div>`).join('');
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{
    document.querySelectorAll(".card").forEach(k=>k.classList.remove("sel"));
    c.classList.add("sel");
    ac(c.dataset.doc, c.dataset.page);
  });
}

let seciliDoc = null, seciliPage = null, seciliMd = false;
async function ac(doc, page){
  const p = page ? `&page=${page}` : "";
  const r = await fetch(`/api/page?doc=${encodeURIComponent(doc)}${p}`).then(x=>x.json());
  const govde = r.html ? `<div class="md">${r.html}</div>` : `<pre>${esc(r.text||'')}</pre>`;
  $("#view").innerHTML = `
    <div class="meta"><span class="tag">${esc(r.doc)}</span>
      <span class="tag">${r.lang||'??'}</span>
      ${r.page!=null?'<span class="tag">s.'+r.page+'</span>':''}${r.label?'<span class="tag" style="background:#2a6f4e;color:#eafff4">🏷 '+esc(r.label)+'</span>':''}
      ${r.md?`<span style="flex:1"></span><button id="editbtn">✏️ Düzenle</button>`:''}</div>
    ${r.image_url?`<img src="${r.image_url}" loading="lazy" alt="sayfa görseli">`:''}
    ${govde}`;
  seciliDoc = r.doc; seciliPage = r.page; seciliMd = !!r.md;
  if(r.md) $("#editbtn").onclick = () => editorAc(r.doc, r.text);
  // etiket çubuğunu bu sayfaya bağla
  $("#lbl").disabled = false; $("#lblsave").disabled = false;
  $("#lbl").value = r.label || "";
  $("#lblinfo").textContent = "🏷 " + r.doc + (r.page!=null?(" s."+r.page):"");
  $("#lbl").placeholder = r.image_url ? "Görsel etiketi (ör: 'X3 terminal şeması')…" : "Metin etiketi…";
}

// ---- etiket kaydet ----
async function etiketKaydet(){
  const label = $("#lbl").value.trim();
  if(!seciliDoc || !label) return;
  $("#lblsave").disabled = true; $("#lblinfo").textContent = "kaydediliyor…";
  try{
    const r = await fetch("/api/label", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({doc: seciliDoc, page: seciliPage, label})}).then(x=>x.json());
    $("#lblinfo").textContent = r.ok ? ("✅ etiket kaydedildi — aramada bulunur") : "hata";
  }catch(e){ $("#lblinfo").textContent = "hata: "+e; }
  $("#lblsave").disabled = false;
}
$("#lblsave").onclick = etiketKaydet;
$("#lbl").addEventListener("keydown", e=>{ if(e.key==="Enter") etiketKaydet(); });

// ---- Markdown düzenleyici ----
let edtDoc = null, zaman = null;
async function editorAc(doc, metin){
  edtDoc = doc;
  $("#edtbas").textContent = "✏️ " + doc;
  $("#edtmetin").value = metin || "";
  $("#kayitdurum").textContent = "";
  $("#modal").classList.add("acik");
  onizlemeGuncelle();
  gecmisYukle(doc);
}
function editorKapat(){ $("#modal").classList.remove("acik"); edtDoc = null; }

async function onizlemeGuncelle(){
  try{
    const r = await fetch("/api/md_preview", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text: $("#edtmetin").value})}).then(x=>x.json());
    $("#onizleme").innerHTML = r.html || "";
  }catch(e){}
}
$("#edtmetin").addEventListener("input", ()=>{ clearTimeout(zaman); zaman = setTimeout(onizlemeGuncelle, 250); });
$("#onizlebtn").onclick = onizlemeGuncelle;
$(".tb").addEventListener("click", e=>{
  const t = e.target.dataset && e.target.dataset.ins; if(!t) return;
  const ta = $("#edtmetin"); const s = ta.selectionStart, e2 = ta.selectionEnd;
  ta.value = ta.value.slice(0,s) + t + ta.value.slice(e2);
  ta.focus(); ta.selectionStart = ta.selectionEnd = s + t.length;
  onizlemeGuncelle();
});

async function gecmisYukle(doc){
  try{
    const r = await fetch(`/api/history?doc=${encodeURIComponent(doc)}`).then(x=>x.json());
    $("#gecmis").textContent = r.commits && r.commits.length
      ? ("· son: " + r.commits[0].yazar + " (" + r.commits[0].tarih + ")") : "";
  }catch(e){}
}

$("#kaydet").onclick = async () => {
  if(!edtDoc) return;
  if(!kullanici()){ kullaniciSor(); if(!kullanici()) return; }
  $("#kaydet").disabled = true; $("#kayitdurum").textContent = "kaydediliyor…";
  try{
    const r = await fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({doc: edtDoc, text: $("#edtmetin").value, user: kullanici()})}).then(x=>x.json());
    if(r.ok){
      const c = r.commit || {};
      $("#kayitdurum").textContent = c.commit
        ? `✅ kaydedildi · git ${c.hash} (${c.yazar})` : `✅ kaydedildi · git: ${c.sebep||"yok"}`;
      setTimeout(()=>{ editorKapat(); ac(edtDoc, null); }, 900);
    } else { $("#kayitdurum").textContent = "hata: " + (r.detail||r); }
  }catch(e){ $("#kayitdurum").textContent = "hata: "+e; }
  $("#kaydet").disabled = false;
};
$("#iptal").onclick = editorKapat;
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modal").classList.contains("acik")) editorKapat(); });

// ---- 💬 Sor (RAG): arşive soru sor, atıflı yanıt al ----
// Not: yanıt/kaynak metinleri şablona gömülürken `esc()` ile kaçırılıyor (dosyadaki diğer
// bölümlerle aynı kural); içerik yerel arşiv DB'sinden ve yerel modelden gelir, dış kaynak yok.
async function sor(){
  const q = ($("#q").value.trim() || prompt("Arşive sorulacak soru:") || "").trim();
  if(!q) return;
  const doc = (seciliDoc && $("#askyalniz") && $("#askyalniz").checked) ? seciliDoc : "";
  $("#view").innerHTML = '<div class="ask"><div class="sor" id="bekle">💬 düşünülüyor… 0 sn</div></div>';
  // Süre sayacı: yanıt gecikince panel "donmuş" görünmesin (ölçüldü: ev modunda 30-90 sn olabiliyor).
  let _sn = 0;
  const _sayac = setInterval(()=>{
    _sn++; const el = $("#bekle");
    if(!el){ clearInterval(_sayac); return; }
    el.textContent = `💬 düşünülüyor… ${_sn} sn · ev modunda 30–90 sn (düşünen model), okulda 20–60 sn`;
  }, 1000);
  const t0 = performance.now();
  let r;
  try{
    r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({q, doc, k:5})}).then(x=>x.json());
  }catch(e){ clearInterval(_sayac); $("#view").innerHTML = `<div class="ask"><div class="hata">istek hatası: ${esc(String(e))}</div></div>`; return; }
  clearInterval(_sayac);
  const ms = Math.round(performance.now()-t0);
  const atlar = (r.atiflar||[]).map(a=>{
    const et = a.page!=null ? `s.${a.page}` : "belge";
    return `<span class="at${a.tanindi?"":" bilinmez"}" data-doc="${esc(a.doc)}" data-page="${a.page??''}"
      title="${a.tanindi?"bağlamdaki kaynak":"bu atıf bağlamda yok (model uydurabilir)"}">🏷 ${esc(a.doc)} · ${et}</span>`;
  }).join(" ");
  const kaynaklar = (r.kaynaklar||[]).map(k=>`<div class="kaynak" data-doc="${esc(k.doc)}" data-page="${k.page??''}">
      <span class="tag">${esc(k.doc)}</span><span>${k.page!=null?("s."+k.page):"belge"}</span>
      ${k.etiket?`<span class="tag" style="background:#2a6f4e;color:#eafff4">🏷 ${esc(k.etiket.slice(0,50))}</span>`:""}
      <span style="flex:1"></span><span>${k.kr} kr</span></div>`).join("");
  if(!r.ok){
    $("#view").innerHTML = `<div class="ask">
      <div class="sor">💬 ${esc(q)}</div>
      <div class="hata">⚠ ${esc(r.sebep||"yanıt üretilemedi")}</div>
      <div class="sor" style="margin-top:10px">Arama yine çalışıyor — yukarıdan arama yapabilirsin.</div>
      ${kaynaklar?`<div class="kaynaklar">${kaynaklar}</div>`:""}</div>`;
  } else if(r.gorev){
    // görev modu: TASLAK üretildi — diske yazılmaz, kullanıcı düzenleyicide onaylar
    $("#view").innerHTML = `<div class="ask">
      <div class="sor">✏️ taslak · ${esc(r.taslak_doc||"")} · ${esc(r.model||"")} · ${r.sure_s??"-"} sn · ${r.tok_s??"-"} tok/s · ${ms} ms</div>
      <div class="hata" style="color:#8a93a6">Bu bir TASLAK — hiçbir şey kaydedilmedi. Aşağıdan düzenleyicide aç,
        gözden geçir, sonra 💾 Kaydet (git kaydı o zaman oluşur).</div>
      <div style="margin:8px 0"><button id="taslakac">✏️ Düzenleyicide aç (taslak)</button></div>
      <div class="yanit">${esc(r.taslak||"")}</div></div>`;
    $("#taslakac").onclick = () => editorAc(r.taslak_doc, r.taslak||"");
  } else {
    const arastirma = (r.arac_sorgulari && r.arac_sorgulari.length)
      ? `<div class="hata" style="color:#8a93a6">🔎 model arşivde araştırdı: ${r.arac_sorgulari.map(x=>esc(x)).join(" · ")}</div>` : "";
    $("#view").innerHTML = `<div class="ask">
      <div class="sor">💬 ${esc(q)} · ${esc(r.model||"")} · ${r.sure_s??"-"} sn · ${r.tok_s??"-"} tok/s · ${r.kaynaklar.length} kaynak (${r.baglam_kr} kr) · ${ms} ms</div>
      ${arastirma}
      ${r.ek_arama?'<div class="hata" style="color:#8a93a6">🔎 model bağlamı yetersiz buldu → <b>koddan ek arama</b> yapıldı'+(r.ek_arama_kabul?' ve <b>yanıt güncellendi</b>':' (yeni bilgi çıkmadı, yanıt aynı kaldı)')+'</div>':""}
      ${r.think_yedek?'<div class="hata" style="color:#8a93a6">ℹ️ düşünme bütçesi yetmedi → yanıt <b>düşünmesiz</b> yeniden sorularak alındı</div>':""}
      <div class="yanit">${esc(r.yanit||"(boş yanıt)")}</div>
      ${r["atıfsız"]?'<div class="hata">⚠ yanıt atıf içermiyor — kaynak sayfasını kendin doğrula</div>':""}
      <div style="margin-top:8px">${atlar}</div>
      <label class="sor" style="display:block;margin-top:10px"><input type="checkbox" id="askyalniz">
        sonraki soruda yalnız açık belgeye bak</label>
      <div class="kaynaklar">${kaynaklar}</div></div>`;
  }
  document.querySelectorAll(".at,.kaynak").forEach(el=>el.onclick=()=>ac(el.dataset.doc, el.dataset.page||null));
}
$("#sorbtn").onclick = sor;

// ---- indeks durumu / yeniden indeksle ----
async function durumYukle(){
  try{
    const s = await fetch("/api/status").then(x=>x.json());
    const tag = s.bayat ? `<span style="color:#ffce6a">⚠ bayat</span>` : `✔`;
    // arka uç: indekslenirken kullanılan (`embed`) ile ŞU AN sorguda kullanılan (`embed_calisiyor`)
    // ayrılınca sessiz hashing düşüşü görünür olur
    const gercek = s.embed_calisiyor && s.embed_calisiyor !== s.embed
      ? `<span style="color:#ffce6a"> · şu an:${s.embed_calisiyor}</span>` : "";
    const soh = s.sohbet ? (s.sohbet.son_hata
      ? `<span style="color:#ffce6a"> · 💬 model yok</span>` : ` · 💬 ${esc(s.sohbet.model||"")}`) : "";
    $("#stat").innerHTML = `${s.kayit} kayıt · embed:${s.embed}${s.model?(" ("+s.model+")"):""}${gercek} ${tag}${soh}`;
    if(s.uyari) $("#stat").innerHTML += `<div style="color:#ffce6a">⚠ ${esc(s.uyari)}</div>`;
  }catch(e){}
}
$("#reindex").onclick = async () => {
  $("#reindex").disabled = true; $("#stat").textContent = "⟳ indeksleniyor…";
  try{
    const r = await fetch("/api/reindex", {method:"POST"}).then(x=>x.json());
    $("#stat").textContent = r.ok ? `✅ ${r.kayit} kayıt` : "hata";
    belgeleriYukle();
  }catch(e){ $("#stat").textContent = "hata"; }
  $("#reindex").disabled = false;
};

$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") ara(); });
$("#go").onclick = ara; $("#lang").onchange = ara; $("#mode").onchange = ara;
$("#docsel").onchange = e => { if(e.target.value) belgeAc(e.target.value); };
belgeleriYukle();
// derin bağlantı: ?q=... &lang=... &mode=...
(() => {
  const u = new URLSearchParams(location.search);
  if (u.get("q")) $("#q").value = u.get("q");
  if (u.get("lang")) $("#lang").value = u.get("lang");
  if (u.get("mode")) $("#mode").value = u.get("mode");
})();
if ($("#q").value.trim()) ara();
durumYukle();
